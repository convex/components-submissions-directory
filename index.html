    <!-- Preload the above-the-fold body font. Publico is not preloaded: no
         public page uses it, so the preload was a wasted 52 KB download.
         URLs must exactly match the url() paths in the built CSS so the
         browser reuses the preloaded response. crossorigin is required for
         font preloads even on the same origin. -->
    <link

    <!-- Warm the Convex connection used by the websocket (every page opens it
         at startup) and by component pages' /api/query requests. In
         production the catalog's first request goes to the same origin (see
         below), so convex.site only gets a dns-prefetch from the script: the
         directory pages ask it for a fresh catalog in the background when
         the edge copy is over a minute old, and fall back to it if the edge
         fails. A full preconnect would compete with the first paint. -->
    <link rel="preconnect" href="%VITE_CONVEX_URL%" crossorigin />

    <!-- Start the directory's catalog request while the JS bundle downloads.
         fetchDirectoryPage() in src/lib/convexHttp.ts picks it up by URL, so
         keep the URL here in sync with directoryPageUrl() there. A mismatch
         just means a normal fetch later. Production builds use the
         same-origin path served (and CDN cached) by the directory-page edge
         function; vite dev has no edge functions, so it asks convex.site. If
         the same-origin request fails, convexHttp.ts retries convex.site. -->
    <script>
      (function () {
        var cloudUrl = "%VITE_CONVEX_URL%";
        var siteUrl = "%VITE_CONVEX_SITE_URL%";
        var match = location.pathname.match(
          /^\/components(?:\/categories\/([^/]+))?\/?$/
        );
        if (!match || cloudUrl.charAt(0) === "%" || !window.fetch) return;
        if (!siteUrl || siteUrl.charAt(0) === "%") {
          siteUrl = cloudUrl.replace(".convex.cloud", ".convex.site");
        }
        if ("%PROD%" === "true") {
          var hint = document.createElement("link");
          hint.rel = "dns-prefetch";
          hint.href = siteUrl;
          document.head.appendChild(hint);
          siteUrl = "/components";
        }
        var url = siteUrl + "/api/directory-page?sortBy=downloads";
        if (match[1]) url += "&category=" + encodeURIComponent(match[1]);
        window.__directoryPrefetch = {
          url: url,
          response: fetch(url).catch(function () {
            return null;
          }),
        };
      })();
    </script>

    <!-- Tell the static shell in #root which route it is on before it is
         parsed, so the shell rules in src/index.css show the directory
         layout and skeleton only where React renders them (same URL pattern
         as the catalog prefetch above). Returning visitors with the catalog
         in localStorage get cards as soon as the JS runs, so their skeleton
         cards are hidden instead of flashed. -->
    <script>
      (function () {
        var root = document.documentElement;
        var path = location.pathname;
        // The auth callback and the /submissions gate render a bare page
        if (/^\/components\/(callback|submissions)\/?$/.test(path)) {
          root.setAttribute("data-shell", "bare");
          return;
        }
        var match = path.match(/^\/components(?:\/categories\/([^/]+))?\/?$/);
        if (!match) return;
        if (match[1]) {
          root.setAttribute("data-shell", "category");
          root.style.setProperty("--shell-slug", JSON.stringify(match[1]));
          return;
        }
        root.setAttribute("data-shell", "directory");
        try {
          if (localStorage.getItem("directoryViewMode") === "list") {
            root.setAttribute("data-shell-view", "list");
          }
          // Same age check as readStoredPage() in src/lib/convexHttp.ts, so
          // the skeleton is only hidden when React will show the saved cards.
          // The 7 days must stay in sync with STORED_PAGE_MAX_AGE_MS there.
          // loadedAt is read from the end of the string (it's written last)
          // rather than parsing the whole ~190KB catalog before first paint.
          var stored = localStorage.getItem("directoryPage:v1");
          var loaded = stored && /"loadedAt":(\d+)\}$/.exec(stored.slice(-40));
          if (loaded && Date.now() - Number(loaded[1]) < 7 * 24 * 60 * 60 * 1000) {
            root.setAttribute("data-shell-cached", "");
          }
        } catch (e) {}
      })();
    </script>
    <!-- Static copy of React's first frame, so the page paints when the HTML
         and CSS arrive instead of after the JS runs. createRoot() replaces it.
         It mirrors these, so update it when they change:
         - src/components/Header.tsx (while auth is loading)
         - src/pages/Directory.tsx (loading state)
         - src/pages/CategoryPage.tsx (loading state)
         - the shell-* rules in src/index.css -->
    <div id="root"><div class="shell antialiased min-h-screen bg-bg-primary">
