[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ============ Headers and redirects ============
# Header and redirect rules live in netlify/_headers and netlify/_redirects,
# which vite.config.ts copies to the publish root. Netlify ignores [[headers]]
# and [[redirects]] in this file on this site: every deploy reported "No
# header rules processed", and a new [[redirects]] rule 404'd on a deploy
# preview while the same rule in _redirects worked. Edge function settings
# below (including excludedPath and cache) are applied.

# ============ Edge Functions ============

# Badge proxy edge function (avoids SPA fallback/OG interception order issues)
[[edge_functions]]
  path = "/components/badge/*"
  function = "component-badge"

# OG meta tags for social crawlers (must be before SPA fallback).
# excludedPath keeps static files out of the edge function so the
# netlify/_headers cache rules apply; og-meta was a pure passthrough for
# these paths anyway. The extension globs cover the logos, social icons and
# favicons in public/. No HTML route ends in one of these extensions: app
# paths with a file extension aren't app routes (isAppPath in
# src/lib/router.ts), and og-meta's own proxies are .txt, .md and .xml.
# cache = "manual" lets Netlify's edge cache og-meta
# responses that send cache headers (component pages, see og-meta.ts), so
# repeat requests skip the Convex lookup. Cached responses are purged on
# every deploy.
[[edge_functions]]
  path = "/components/*"
  excludedPath = ["/components/assets/*", "/components/fonts/*", "/components/_img/*", "/components/_src/*", "/components/*.svg", "/components/*.png", "/components/*.ico", "/components/*.webp"]
  function = "og-meta"
  cache = "manual"

[[edge_functions]]
  path = "/components/*/*.md"
  function = "component-markdown"

# Convex storage files that Image CDN resizes thumbnails from. Serves raster
# images only, with nosniff and a sandbox CSP, so an uploaded HTML or SVG file
# can't run as a page on www.convex.dev (see component-image-source.ts)
[[edge_functions]]
  path = "/components/_src/*"
  function = "component-image-source"
